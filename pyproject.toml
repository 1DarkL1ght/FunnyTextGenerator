[project]
name = "funny-text-generator"
version = "0.0.1"
description = "VAE text generation"
readme = "README.md"
requires-python = "==3.11.9"

dependencies = [
    "torch==2.11.0",
    "torcheval==0.0.7",
    "torchtune==0.6.1",
    "torchao==0.17.0",
    "torchmetrics==1.8.2",
    "transformers==5.14.1",
    "peft==0.18.1",
    "numpy==2.3.5",
    "pandas==3.0.0",
    "tqdm==4.67.3",
    "tensorboard==2.20.0",
    "rich==14.3.2",
    "tokenizers==0.22.2",
    "mlcroissant==1.0.22",
    "kagglesdk==0.1.15",
    "huggingface-hub==1.24.0",
    "jsonargparse==4.49.0",
    "setuptools==81",
    "flash-attn",
    "nvidia-cuda-runtime==13.0.96",
]

[project.optional-dependencies]
annotate = [
    "vllm==0.20.1",
    "outlines==1.3.2",
    "pyarrow==25.0.0",
    "fastparquet==2026.5.0",
    "rapidfuzz",
]

[[tool.uv.index]]
name = "pytorch-cuda-130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda-130" }
flash-attn = [
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.4/flash_attn-2.8.3+cu130torch2.11-cp311-cp311-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.6/flash_attn-2.8.3+cu130torch2.11-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }
]
